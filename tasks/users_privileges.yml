# file: postgresql/tasks/users_privileges.yml
# Make sure the service is running first
- name: PostgreSQL | Ensure PostgreSQL is running
  service:
    name: "{{ postgresql_service_name }}"
    state: started

# Entries without a privilege string only ensure the role exists (e.g. replication users)
- name: PostgreSQL | Create replication user
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    state: present
    login_user: "{{ postgresql_admin_user }}"
    login_password: "{{ postgresql_admin_password | default(omit) }}"
    login_host: "{{ item.host | default(omit) }}"
    login_port: "{{ postgresql_port }}"
    login_db: "{{ item.db | default('postgres') }}"
  become: yes
  become_user: "{{ postgresql_admin_user }}"
  loop: "{{ postgresql_user_privileges | default([]) }}"
  when:
    - item.priv is not defined
    - item.privs is not defined
  loop_control:
    label: "{{ item.name }}"

# Grant database-level privileges
- name: PostgreSQL | Grant database privileges
  community.postgresql.postgresql_privs:
    type: database
    login_db: "{{ item.db }}"               # database to grant on
    roles: "{{ item.name }}"          # role receiving privileges
    # `priv` is the key documented in the README; `privs` is accepted as an alias
    privs: "{{ item.privs | default(item.priv | default('ALL')) }}"
    grant_option: "{{ item.grant_option | default(omit) }}"
    state: present
    login_user: "{{ postgresql_admin_user }}"
    login_password: "{{ postgresql_admin_password | default(omit) }}"
    login_host: "{{ item.host | default(omit) }}"
    login_port: "{{ postgresql_port }}"
  become: yes
  become_user: "{{ postgresql_admin_user }}"
  loop: "{{ postgresql_user_privileges | default([]) }}"
  when: item.priv is defined or item.privs is defined
  loop_control:
    label: "{{ item.name }}"
